<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Site - Wiru2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .badge {
      display: inline-block;
      background: rgba(99,102,241,0.2);
      border: 1px solid rgba(99,102,241,0.5);
      color: #a5b4fc;
      padding: 0.3rem 1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(90deg, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      max-width: 500px;
      margin: 0 auto 2rem;
      line-height: 1.6;
    }
    .stack {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }
    .tag {
      background: rgba(56,189,248,0.1);
      border: 1px solid rgba(56,189,248,0.3);
      color: #7dd3fc;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .status {
      margin-top: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #4ade80;
      font-size: 0.9rem;
    }
    .dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">🚀 Deployed via Vercel</div>
    <h1>Hello, Wiru2!</h1>
    <p>Your test site is live on Vercel. Built for automation, AI integrations, and fast deployments from Kraków, Poland.</p>
    <div class="stack">
      <span class="tag">N8N Workflows</span>
      <span class="tag">AI Integration</span>
      <span class="tag">Claude AI</span>
      <span class="tag">Vercel</span>
      <span class="tag">Node.js</span>
    </div>
    <div class="status">
      <div class="dot"></div>
      Deployment successful
    </div>
  </div>
</body>
</html>
